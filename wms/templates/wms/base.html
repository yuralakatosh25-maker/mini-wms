<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mini-wms{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'wms:top-products' %}">mini-wms</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'top-products' %}active{% endif %}"
           href="{% url 'wms:top-products' %}">Nejprodávanější</a>
      </li>
      <li class="nav-item"><a class="nav-link" href="{% url 'admin:wms_order_changelist' %}">Objednávky</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'admin:wms_product_changelist' %}">Produkty</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'export-shipments' %}">Export CSV</a></li>
    </ul>
    {% if user.is_authenticated %}
      <span class="navbar-text small">{{ user.get_username }}</span>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
